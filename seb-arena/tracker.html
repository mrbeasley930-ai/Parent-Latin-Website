 {q:"Which teeth are flat and used for grinding?",o:["Molars", "Canines", "Incisors", "Milk teeth"],a:0,why:"Molars at the back crush and grind food.",t:2,k:"Human body",c:"The big flat ones at the back that crush food."},
 {q:"Muscles work in…",o:["threes","pairs","single units","groups of ten"],a:1,why:"One muscle pulls a bone one way, its partner pulls it back (like biceps and triceps).",t:2,k:"Human body",c:"A muscle can pull but never push. So to move a bone back again, another muscle must pull the other way."},
 {q:"Which gas do we need from the air we breathe in?",o:["Carbon dioxide","Nitrogen","Oxygen","Helium"],a:2,why:"Our bodies use oxygen to release energy from food.",t:1,k:"Human body",c:"The gas that fires need too, and that a diver carries in a tank."},
 {q:"Which gas do we breathe OUT more of than we breathe in?",o:["Oxygen gas", "Carbon dioxide", "Hydrogen gas", "Helium gas"],a:1,why:"Breathing out releases the carbon dioxide our bodies make.",t:2,k:"Human body",c:"Plants take in this gas; we give it out. It's what makes fizzy drinks fizzy."},
 {q:"The skeleton's three main jobs are support, movement and…",o:["digestion", "protection", "breathing", "hearing"],a:1,why:"The skull protects the brain and the ribs protect the heart and lungs.",t:1,k:"Human body",c:"Your skull is round your brain and your ribs are round your heart. What are the bones doing there?"},
 {q:"The correct order of the human life cycle is…",o:["baby, adult, child, teenager", "baby, child, teenager, adult", "child, baby, adult, teenager", "teenager, child, baby, adult"],a:1,why:"We grow from baby to child to adolescent (teenager) to adult.",t:1,k:"Human body",c:"Youngest first. A teenager (adolescent) comes before a grown-up."},
 {q:"Which material is magnetic?",o:["Plastic", "Iron", "Wood", "Glass"],a:1,why:"Iron, steel, nickel and cobalt are magnetic. Most metals (like copper) are not.",t:1,k:"Materials",c:"Only a few metals are magnetic. Think what a fridge magnet sticks to — and what a cooking pan is often made of."},
 {q:"Which is the best conductor of electricity?",o:["Rubber","Copper","Wood","Paper"],a:1,why:"Metals such as copper let electricity flow — that's why wires are copper.",t:1,k:"Materials",c:"Electric wires inside a cable are made of an orange-brown metal."},
 {q:"Which material is an electrical INSULATOR?",o:["Plastic","Steel","Copper","Aluminium"],a:0,why:"Plastic stops electricity flowing — it coats the wires to keep us safe.",t:1,k:"Materials",c:"The coating on the outside of a cable — it stops you getting a shock."},
 {q:"Which material is a good THERMAL insulator (keeps heat in)?",o:["Metal","Wool","Glass","Water"],a:1,why:"Wool traps air, and trapped air is a poor conductor of heat.",t:2,k:"Materials",c:"Which would you wear to keep warm? It traps air, and trapped air keeps heat in."},
 {q:"Sugar stirred into water seems to vanish. It has…",o:["melted","evaporated","dissolved","frozen"],a:2,why:"The sugar dissolves to make a solution; it is still there.",t:1,k:"Materials",c:"It hasn't melted (that needs heat) and it hasn't gone — taste the water. The sugar has mixed into the water so finely you can't see it."},
 {q:"How could you get the salt back out of salt water?",o:["Pour it through a filter", "Pour it through a sieve", "Leave the water to evaporate", "Put it in the freezer"],a:2,why:"Evaporate the water and the salt is left behind.",t:2,k:"Materials",c:"The salt has dissolved, so a filter won't catch it. What happens to a puddle in the sun — and what is left behind?"},
 {q:"How would you separate sand from water?",o:["Leave it to evaporate", "Pour it through a filter", "Hold a magnet over it", "Stir it very quickly"],a:1,why:"Sand does not dissolve, so a filter catches it and lets the water through.",t:2,k:"Materials",c:"Sand does NOT dissolve. Think of a coffee filter or a sieve with very small holes."},
 {q:"Which change is REVERSIBLE?",o:["Burning a wooden log", "Baking a sponge cake", "Melting an ice cube", "Frying an egg in a pan"],a:2,why:"Ice can melt and freeze again. Burning and baking cannot be undone.",t:1,k:"Materials",c:"Reversible means you can change it back. Which of these can you undo by cooling it down?"},
 {q:"Which change is IRREVERSIBLE?",o:["Freezing water", "Dissolving salt", "Burning paper", "Melting chocolate"],a:2,why:"Burning makes new substances (ash, smoke). You cannot get the paper back.",t:2,k:"Materials",c:"Irreversible means it can never go back. Which makes something completely new — ash and smoke?"},
 {q:"Which is a TRANSPARENT material?",o:["Oak wood", "Clear glass", "Red brick", "Thick cardboard"],a:1,why:"Transparent means light passes straight through, so you can see clearly.",t:1,k:"Materials",c:"Transparent = see-through. Which one is a window made of?"},
 {q:"A rock that lets water pass through it is…",o:["permeable","impermeable","invisible","magnetic"],a:0,why:"Permeable rocks like sandstone soak up water; impermeable rocks like slate do not.",t:3,k:"Materials",c:"Per = through, meare = to pass (Latin). Sponge-like rocks such as sandstone soak water up."},
 {q:"At what temperature does water boil?",o:["0 °C","50 °C","100 °C","200 °C"],a:2,why:"Water boils at 100 °C and freezes at 0 °C.",t:1,k:"States of matter",c:"The temperature of a kettle at full steam. On the Celsius scale it's a nice round number."},
 {q:"At what temperature does water freeze?",o:["0 °C","10 °C","32 °C","100 °C"],a:0,why:"Water freezes at 0 °C.",t:1,k:"States of matter",c:"The temperature where ice forms — the lowest round number on the Celsius scale."},
 {q:"Water vapour turning back into liquid water is called…",o:["evaporation", "condensation", "melting", "freezing"],a:1,why:"Condensation — like water droplets on a cold window.",t:2,k:"States of matter",c:"Think of the drops on the inside of a cold window, or on a cold can of drink. Con-dense: the gas gets dense again."},
 {q:"A liquid turning into a gas is called…",o:["condensation", "freezing", "evaporation", "melting"],a:2,why:"Puddles disappear because the water evaporates.",t:1,k:"States of matter",c:"A puddle disappears in the sun. The water has become invisible vapour in the air."},
 {q:"Which is NOT one of the three states of matter?",o:["Solid", "Liquid", "Gas", "Energy"],a:3,why:"Solid, liquid and gas are the three states. Light is energy.",t:1,k:"States of matter",c:"Solid, liquid, gas — ice, water, steam. One option isn't a state of matter at all."},
 {q:"Which of these is a GAS at room temperature?",o:["Oxygen", "Ice", "Milk", "Iron"],a:0,why:"Oxygen is a gas in the air around us.",t:1,k:"States of matter",c:"A gas has no shape and spreads out to fill a room. Which one are you breathing right now?"},
 {q:"Sound is made when something…",o:["gets very hot", "vibrates quickly", "glows brightly", "melts slowly"],a:1,why:"Vibrations push the air, and those waves reach your ears.",t:1,k:"Sound & light",c:"Touch your throat while you hum. Pluck a guitar string. What is the string doing?"},
 {q:"Sound cannot travel through…",o:["deep water", "solid wood", "empty space", "thick fog"],a:2,why:"Sound needs something to vibrate — in space there is nothing, so it is silent.",t:2,k:"Sound & light",c:"Sound needs something to wobble — air, water or a solid. Where is there nothing at all?"},
 {q:"A higher-pitched sound is made by…",o:["slower vibrations", "faster vibrations", "louder vibrations", "longer vibrations"],a:1,why:"Faster vibrations = higher pitch (like a short, tight guitar string).",t:2,k:"Sound & light",c:"A short tight string gives a high note; a long loose one gives a low note. The short string wobbles… faster or slower?"},
 {q:"Light travels in…",o:["gentle curves", "wide circles", "straight lines", "sharp zigzags"],a:2,why:"Light travels in straight lines — that's why shadows have sharp edges.",t:1,k:"Sound & light",c:"Shadows have sharp edges and you can't see round corners. What does that tell you about the path light takes?"},
 {q:"A shadow is made when light is…",o:["reflected off a shiny mirror", "blocked by a solid object", "bent as it goes into water", "switched off at the source"],a:1,why:"Opaque objects block light, leaving a dark shape behind them.",t:1,k:"Sound & light",c:"A shadow is the dark patch where the light couldn't get to. Something is in the way."},
 {q:"We see objects because light…",o:["shines out of our own eyes", "bounces off them into our eyes", "warms them up so they glow", "passes straight through them"],a:1,why:"Light bounces (reflects) off objects and travels into our eyes.",t:2,k:"Sound & light",c:"Light comes from the Sun or a lamp, hits the object, then bounces into your eyes. What's the word for bouncing light?"},
 {q:"For a bulb to light up, a circuit must be…",o:["broken in one place", "complete all the way round", "made of plastic wire", "at least a metre long"],a:1,why:"Electricity only flows round a complete loop.",t:1,k:"Electricity",c:"Electricity has to be able to flow all the way round and back to the battery — no gaps."},
 {q:"What is a switch for?",o:["Making the bulb shine brighter", "Opening or closing the circuit", "Storing spare electricity", "Keeping the wires cool"],a:1,why:"A switch opens a gap (off) or closes it (on).",t:1,k:"Electricity",c:"A switch makes a gap in the wire (off) or closes it (on)."},
 {q:"Adding more batteries (cells) to a bulb circuit makes the bulb…",o:["dimmer than before", "brighter than before", "change to a new colour", "flash on and off"],a:1,why:"More cells push more electricity round, so the bulb glows brighter.",t:2,k:"Electricity",c:"More batteries = more push for the electricity."},
 {q:"Which part of a plant takes in water from the soil?",o:["The leaves", "The flowers", "The roots", "The petals"],a:2,why:"Roots absorb water and nutrients and anchor the plant.",t:1,k:"Plants",c:"The part underground, spreading out into the soil."},
 {q:"Which part of a plant makes food using sunlight?",o:["The roots", "The leaves", "The stem", "The seeds"],a:1,why:"Leaves use light, water and carbon dioxide to make food.",t:2,k:"Plants",c:"The flat green parts that catch the light."},
 {q:"Pollination is when pollen moves from one flower to…",o:["the roots underground", "the soil around it", "a different flower", "the leaves above"],a:2,why:"Insects and wind carry pollen between flowers so seeds can form.",t:2,k:"Plants",c:"Bees carry pollen on their legs. Where do they take it when they leave one flower?"},
 {q:"Which is NOT a way seeds are spread?",o:["Blown by the wind", "Carried by animals", "Floating on water", "Pulled by magnets"],a:3,why:"Seeds travel by wind, animals, water and exploding pods.",t:1,k:"Plants",c:"Dandelion seeds fly, burrs stick to animals, coconuts float. One option is silly."},
 {q:"Which do plants NOT need to grow well?",o:["Light", "Water", "Sugar", "Air"],a:2,why:"Plants need light, water, air, nutrients and the right temperature.",t:1,k:"Plants",c:"Plants need light, water, air and nutrients from the soil. One option is a treat for people."},
 {q:"Fossils are…",o:["new rocks formed by volcanoes", "remains of living things turned to rock", "ice frozen deep under the ground", "pieces of rock fallen from outer space"],a:1,why:"Fossils form over millions of years when remains are buried and turn to rock.",t:2,k:"Rocks",c:"Fossils are found in rock and show the shapes of animals and plants from millions of years ago."},
 {q:"Soil is made mostly of tiny rock pieces mixed with…",o:["melted plastic and metal", "rotted plants and animals", "crushed glass and sand", "dried salt and chalk"],a:1,why:"Organic matter (rotted plants and animals) mixes with rock pieces to make soil.",t:2,k:"Rocks",c:"Soil is dark and crumbly because of rotted leaves, roots and creatures mixed with the ground-up rock."},
 {q:"A pond, a desert and a rainforest are all examples of…",o:["habitats", "planets", "materials", "forces"],a:0,why:"A habitat is where a living thing lives.",t:1,k:"Living things",c:"Each is a place where particular animals and plants live."},
 {q:"Which planet is furthest from the Sun?",o:["Uranus","Neptune","Saturn","Jupiter"],a:1,why:"Order: Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune.",t:2,k:"Space",c:"Last in the rhyme: My Very Easy Method Just Speeds Up Naming. Deep blue and freezing."},
 {q:"The Moon seems to change shape each month because…",o:["it slowly gets smaller each month", "we see different amounts of its lit side", "clouds in space hide parts of it", "it spins faster at some times than others"],a:1,why:"The Moon's phases come from how much of its lit side faces Earth.",t:3,k:"Space",c:"The Moon doesn't make its own light — the Sun lights one half of it. We see different amounts of the lit half as it goes round us."},
 {q:"A year on Mercury is shorter than a year on Earth because Mercury…",o:["it is a much smaller planet", "its path round the Sun is shorter", "it spins round much faster", "it is much colder than Earth"],a:1,why:"Planets near the Sun have shorter orbits — Mercury's year is 88 days.",t:3,k:"Space",c:"A year = one trip round the Sun. Mercury's trip is a small circle; Earth's is a big one."},
 {q:"What is a solution?",o:["A solid that has melted in the heat", "A liquid with a solid dissolved in it", "A gas that has been frozen solid", "A mixture you can separate with a sieve"],a:1,why:"Salt water is a solution: the salt is dissolved and spread evenly through the water.",t:3,k:"Materials",c:"When salt dissolves in water you get a clear liquid with the salt spread all through it."},
 {q:"Which of these is a solid, a liquid AND a gas depending on temperature?",o:["Wood","Water","Paper","Rubber"],a:1,why:"Ice, water and steam are the same substance in three states.",t:2,k:"States of matter",c:"Think of ice, a drink and steam from a kettle. Same stuff, three states."},
 {q:"Why do you see lightning before you hear thunder?",o:["Light travels far faster than sound", "Sound travels far faster than light", "The thunder happens much later", "Your eyes are closer to the sky"],a:0,why:"Light reaches you almost instantly; sound takes about 3 seconds per kilometre.",t:3,k:"Sound & light",c:"They happen at the same moment. One of them travels to you far, far faster than the other."},
 {q:"The force that makes a parachute fall slowly is…",o:["gravity", "air resistance", "magnetism", "water resistance"],a:1,why:"The big canopy catches lots of air, so air resistance pushes up against gravity.",t:2,k:"Forces",c:"The big canopy catches lots of air. Which force pushes up against falling objects?"}
];

 {q:"Which sentence is a SIMILE?",o:["The car is a silver rocket.", "The car was as fast as a rocket.", "The car zoomed off the line.", "The rocket is faster than a car."],a:1,why:"'As fast as' makes it a simile.",t:1,k:"Figurative language",c:"A simile compares two things using 'like' or 'as'."},
 {q:"What is a SYNONYM?",o:["a word that means the opposite", "a word that means the same", "a word that rhymes with another", "a word with a capital letter"],a:1,why:"Synonym = same meaning. Antonym = opposite meaning.",t:1,k:"Vocabulary",c:"Syn- means 'together/same' (like 'synchronised'). Anto- means 'against/opposite'."},
 {q:"Which word means the same as INQUISITIVE?",o:["curious","tired","wealthy","silent"],a:0,why:"Inquisitive = eager to find out, curious.",t:3,k:"Synonyms",c:"An inquisitive person asks lots of questions — in-quis-itive is from 'inquire'."},
 {q:"Which word means the same as MISCHIEVOUS?",o:["playfully naughty", "deadly serious", "completely asleep", "badly frightened"],a:0,why:"Mischievous = playfully naughty.",t:3,k:"Synonyms",c:"A mischievous puppy chews your slippers — up to mischief, but not evil."},
 {q:"Which word means the same as INDUSTRIOUS?",o:["lazy", "hard-working", "wealthy", "noisy"],a:1,why:"Industrious = works hard.",t:3,k:"Synonyms",c:"Industry is work. An industrious pupil gets on with it."},
 {q:"What is the plural of CHILD?",o:["childs","childes","children","childrens"],a:2,why:"Child → children. Some plurals are irregular: mouse → mice, foot → feet.",t:1,k:"Grammar",c:"Not every plural adds -s. Think how you'd say 'lots of child'."},
 {q:"What is the plural of BOX?",o:["boxs","boxes","boxies","box's"],a:1,why:"Words ending in -x, -s, -ch, -sh add -es.",t:1,k:"Grammar",c:"Try saying 'boxs' out loud — you can't. Words ending in -x need an extra sound."},
 {q:"Which sentence uses a RELATIVE CLAUSE?",o:["The driver, who had never lost, waved.", "The driver waved happily to the crowd.", "Waving to the crowd, the driver smiled.", "The crowd waved and cheered the driver."],a:0,why:"'Who had never lost' is a relative clause, starting with who/which/that.",t:3,k:"Grammar",c:"A relative clause adds extra information and starts with who, which or that, often between commas."},
 {q:"What does the word 'modal verb' MIGHT show in 'It MIGHT rain'?",o:["certainty", "possibility", "the past", "a command"],a:1,why:"Modal verbs (might, could, should, must) show how likely or necessary something is.",t:3,k:"Grammar",c:"Might, could, may — these show that something isn't certain."}
];

<script>
const CLOUD={endpoint:"https://vestigia-store.mrbeasley930.workers.dev",book:"seb-arena-26"};
const QS=new URLSearchParams(location.search); const CLS=QS.get("test")?"TEST":"SEB"; const CAND=QS.get("player")||"Seb";
const KEY=CLOUD.book+"::"+CLS+"::"+CAND, PKEY=CLOUD.book+"::"+CLS+"::_parent";
const WN={mine:"Block Mine (Maths)",brick:"Brick Builder (Spelling)",astro:"Astro Lab (Science)",forza:"Fraction Raceway",words:"Word Wrestling (Reading & grammar)",atlas:"Atlas Quest (History & geography)"};
const WE={mine:"⛏️",brick:"🧱",astro:"🤖",forza:"🏎️",words:"💪",atlas:"🗺️"};
const TIER=["","Wood","Stone","Iron","Diamond","Netherite"];
const $=id=>document.getElementById(id); const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let REC=null, PAR={rate:50,redeemedXP:0,ledger:[],focus:null};
const TABS=[["over","Overview"],["subj","Subjects"],["need","Needs work"],["boss","Bosses & badges"],["bank","iPad time bank"],["dad","Dad's Challenge"],["data","Data"]];
$("tabs").innerHTML=TABS.map(([id,n],i)=>`<button class="${i?"":"on"}" data-t="${id}" onclick="tab('${id}')">${n}</button>`).join("");
function tab(id){ document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===id)); document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("on",p.id==="p-"+id)); }
tab("over");
async function getKey(k){ const r=await fetch(CLOUD.endpoint+"?key="+encodeURIComponent(k)); if(!r.ok) return null; const j=await r.json(); return j&&j.data?j.data:null; }
async function putParent(){ const r=await fetch(CLOUD.endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({key:PKEY,cls:CLS,cand:"_parent",book:CLOUD.book,data:PAR,savedAt:new Date().toISOString()})}); if(!r.ok) alert("Save failed (HTTP "+r.status+")"); return r.ok; }
async function loadAll(){ $("status").textContent="loading…"; try{ const [rec,par]=await Promise.all([getKey(KEY),getKey(PKEY)]); REC=rec; if(par) PAR=Object.assign(PAR,par); $("status").textContent=rec?`${CAND} · last saved ${fmt(rec.updatedAt)}`:"No record yet — Seb hasn't played."; render(); }catch(e){ $("status").textContent="Couldn't reach the store: "+e.message; } }
function fmt(iso){ if(!iso) return "—"; const d=new Date(iso); return d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})+" "+d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}); }
function dayKey(iso){ const d=new Date(iso); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function rankFor(xp){ let r=RANKS[0],next=null; for(const x of RANKS){ if(xp>=x[0]) r=x; else { next=x; break; } } return {r,next}; }
function pct(a,b){ return b?Math.round(a/b*100):0; }
function barHTML(p){ const c=p>=75?"":p>=50?"warn":"bad"; return `<div class="bar"><i class="${c}" style="width:${p}%"></i></div>`; }
function sessions(log){ const out=[]; let cur=null; log.forEach(e=>{ const t=new Date(e.at).getTime(); if(!cur||t-cur.end>30*60000){ cur={start:t,end:t,n:0,r:0,ws:new Set()}; out.push(cur);} cur.end=t; cur.n++; if(e.ok>0) cur.r++; cur.ws.add(e.w); }); return out; }
function bankMinutes(){ return Math.max(0,Math.floor(((REC?REC.xp:0)-(PAR.redeemedXP||0))/Math.max(1,PAR.rate||50))); }

function render(){
  if(!REC){ $("p-over").innerHTML=`<div class="card">No record yet. Once Seb signs in and answers a question, everything appears here.</div>`; renderBank(); renderDad(); return; }
  const log=REC.log||[]; const {r,next}=rankFor(REC.xp); const secs=Object.values(REC.worlds).reduce((a,w)=>a+(w.secs||0),0);
  const today=dayKey(new Date().toISOString()); const todayLog=log.filter(e=>dayKey(e.at)===today); const ses=sessions(log);
  const last14=[]; for(let i=13;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); last14.push(dayKey(d.toISOString())); }
  const perDay=last14.map(k=>{ const L=log.filter(e=>dayKey(e.at)===k); return {k,n:L.length,r:L.filter(e=>e.ok>0).length}; }); const mx=Math.max(1,...perDay.map(d=>d.n));
  $("p-over").innerHTML=`
   <div class="grid">
    <div class="stat"><b>${r[2]} ${r[1]}</b><small>${REC.xp} XP${next?` · ${next[0]-REC.xp} to ${next[1]}`:""}</small></div>
    <div class="stat"><b>${REC.streak.days} day${REC.streak.days===1?"":"s"}</b><small>streak · ${REC.playedDays.length} days played in total</small></div>
    <div class="stat"><b>${REC.answered}</b><small>questions answered · ${pct(REC.right,REC.answered)}% right</small></div>
    <div class="stat"><b>${Math.round(secs/60)} min</b><small>active time in total · ${Math.round(todayLog.reduce((a,e)=>a+Math.min(60,e.secs||0),0)/60)} min today</small></div>
    <div class="stat"><b>${bankMinutes()} min</b><small>iPad time banked (rate ${PAR.rate} XP/min)</small></div>
    <div class="stat"><b>${REC.comebacks}</b><small>comebacks landed · best combo ${REC.bestCombo}</small></div>
    <div class="stat"><b>${Object.values(REC.hinted||{}).filter(h=>!h.secure).length}</b><small>clue items still open · ${Object.values(REC.hinted||{}).filter(h=>h.secure).length} made secure</small></div>
   </div>
   <div class="card" style="margin-top:14px"><h2>Questions per day (last 14 days)</h2><div class="chart">${perDay.map(d=>`<div title="${d.k}: ${d.n} answered, ${d.r} right"><span>${d.n||""}</span><i style="height:${d.n/mx*100}%"></i></div>`).join("")}</div><div class="axis">${perDay.map(d=>`<span>${d.k.slice(8)}</span>`).join("")}</div></div>
   <div class="card"><h2>Recent sessions</h2><table><tr><th>When</th><th>Length</th><th>Answered</th><th>Right</th><th>Worlds</th></tr>${ses.slice(-10).reverse().map(s=>`<tr><td>${fmt(new Date(s.start).toISOString())}</td><td>${Math.max(1,Math.round((s.end-s.start)/60000))} min</td><td>${s.n}</td><td>${pct(s.r,s.n)}%</td><td>${[...s.ws].map(w=>WE[w]).join(" ")}</td></tr>`).join("")}</table></div>
   <div class="card"><h2>How to read this</h2><p class="note">A "right" answer includes second-try successes (the page gives one hint and a second go). First-try accuracy per topic is in Subjects. Difficulty rises after 5 first-try rights out of 6 and drops after 4 misses out of 6, so a steady level with 60–80% accuracy is the sweet spot: challenged but not stuck.</p></div>`;

  // subjects
  $("p-subj").innerHTML=Object.keys(WN).map(w=>{ const W=REC.worlds[w]; const L=log.filter(e=>e.w===w); const first=L.filter(e=>e.ok===2).length; const topics={};
    L.forEach(e=>{ const t=topics[e.k]=topics[e.k]||{a:0,r:0,f:0,s:0}; t.a++; if(e.ok>0) t.r++; if(e.ok===2) t.f++; t.s+=Math.min(60,e.secs||0); });
    const rows=Object.entries(topics).sort((a,b)=>pct(a[1].f,a[1].a)-pct(b[1].f,b[1].a)).map(([k,t])=>`<tr><td>${esc(k)}</td><td>${t.a}</td><td>${pct(t.r,t.a)}%</td><td>${pct(t.f,t.a)}%</td><td>${(t.s/t.a).toFixed(0)}s</td><td>${barHTML(pct(t.f,t.a))}</td></tr>`).join("");
    return `<div class="card"><h2>${WE[w]} ${WN[w]} <span class="pill">Level ${W.tier} · ${TIER[W.tier]}</span> <span class="pill">${W.answered} answered</span> <span class="pill">${pct(W.right,W.answered)}% right · ${pct(first,L.length)}% first try</span> <span class="pill">${Math.round((W.secs||0)/60)} min</span>${w==="forza"&&W.bestTime?` <span class="pill">PB ${(W.bestTime/1000).toFixed(1)}s</span>`:""}</h2>
      ${rows?`<table><tr><th>Topic</th><th>Asked</th><th>Right</th><th>First try</th><th>Avg time</th><th></th></tr>${rows}</table>`:`<p class="note">Not played yet.</p>`}</div>`; }).join("");

  // needs work
  const cutoff=Date.now()-30*864e5; const miss={};
  log.filter(e=>e.ok<2&&new Date(e.at).getTime()>cutoff).forEach(e=>{ const id=e.w+"|"+e.q; const m=miss[id]=miss[id]||{w:e.w,q:e.q,ans:e.ans,k:e.k,n:0,m0:0,given:[],last:e.at}; m.n++; if(e.ok===0) m.m0++; if(e.given&&!m.given.includes(e.given)) m.given.push(e.given); m.last=e.at; });
  const fixedSince={}; log.filter(e=>e.ok===2).forEach(e=>{ fixedSince[e.w+"|"+e.q]=e.at; });
  const list=Object.entries(miss).map(([id,m])=>Object.assign(m,{fixed:fixedSince[id]&&fixedSince[id]>m.last})).sort((a,b)=>b.n-a.n||b.m0-a.m0);
  const spell=list.filter(m=>m.w==="brick");
  const H=Object.values(REC.hinted||{}).sort((x,y)=>(x.secure-y.secure)||(y.n-x.n)||((y.last||"")>(x.last||"")?1:-1));
  const open=H.filter(h=>!h.secure), sec=H.filter(h=>h.secure);
  const hintRows=arr=>arr.map(h=>`<tr><td>${WE[h.w]}</td><td>${esc(h.q)}<br><span class="mute" style="font-size:.78rem">${esc(h.k)}</span></td><td><b>${esc(h.ans)}</b></td><td>${h.n}×</td><td class="mute">${fmt(h.last)}</td><td>${h.secure?'<span class="good">Secure ✓</span>':`<span class="warnc">${h.ok}/2 clean rights</span>`}</td></tr>`).join("");
  $("p-need").innerHTML=`<div class="card"><h2>💡 Clues used — material he hasn't met yet</h2><p class="note">Every question where he pressed Clue. These are the gaps: the Arena keeps re-asking them (about one question in three in that world) until he gets each one right first time, without a clue, twice — then it's marked Secure. Open items are the list for the next content update.</p>
    ${open.length?`<h3>Still open (${open.length})</h3><table><tr><th>World</th><th>Question</th><th>Answer</th><th>Clues</th><th>Last</th><th>Status</th></tr>${hintRows(open)}</table>`:`<p>No open clue items.</p>`}
    ${sec.length?`<h3>Now secure (${sec.length})</h3><table><tr><th>World</th><th>Question</th><th>Answer</th><th>Clues</th><th>Last</th><th>Status</th></tr>${hintRows(sec)}</table>`:""}
    <div class="row" style="margin-top:10px"><button onclick="copyOpenHints()">Copy the open list for Claude</button></div></div>
  <div class="card"><h2>Things to go over (last 30 days)</h2><p class="note">Every question Seb missed on the first try, most-missed first. "Fixed" means he has since got it right first time. Spelling words are also listed separately below — handy for a look-cover-write at the kitchen table.</p>
    ${list.length?`<table><tr><th>World</th><th>Question</th><th>Answer</th><th>He put</th><th>Missed</th><th>Status</th></tr>${list.slice(0,80).map(m=>`<tr><td>${WE[m.w]}</td><td>${esc(m.q)}<br><span class="mute" style="font-size:.78rem">${esc(m.k)}</span></td><td><b>${esc(m.ans)}</b></td><td class="mute">${esc(m.given.slice(0,3).join(", "))}</td><td>${m.n}× ${m.m0?`<span class="badc">(${m.m0} shown answer)</span>`:""}</td><td>${m.fixed?'<span class="good">Fixed ✓</span>':'<span class="warnc">Open</span>'}</td></tr>`).join("")}</table>`:`<p>Nothing missed recently.</p>`}</div>
    <div class="card"><h2>Spelling list</h2>${spell.length?`<p>${spell.map(m=>`<span class="pill" style="font-size:1rem;color:var(--ink)">${esc(m.ans)}${m.fixed?" ✓":""}</span>`).join(" ")}</p>`:`<p class="note">No spelling slips yet.</p>`}</div>`;

  // bosses & badges
  $("p-boss").innerHTML=`<div class="card"><h2>Bosses</h2><table><tr><th>Boss</th><th>World</th><th>Health left</th><th>Tries</th><th>Beaten</th></tr>${BOSSES.map(b=>{ const s=(REC.bosses||{})[b.id]||{}; const hp=s.hp==null?b.hp:s.hp; return `<tr><td>${b.icon} ${esc(b.name)}</td><td>${b.world==="all"?"All":WN[b.world]}</td><td>${s.beaten?"—":hp+"/"+b.hp}</td><td>${s.attempts||0}</td><td>${s.beaten?`<span class="good">×${s.beaten}</span>`:'<span class="mute">not yet</span>'}</td></tr>`; }).join("")}</table></div>
    <div class="card"><h2>Badges (${REC.badges.length}/${BADGES.length})</h2><p>${BADGES.map(b=>`<span class="pill" style="${REC.badges.includes(b.id)?"color:var(--ink)":"opacity:.45"}">${b.icon} ${b.name}</span>`).join(" ")}</p></div>
    <div class="card"><h2>Today's quests</h2>${(REC.daily&&REC.daily.quests||[]).map(q=>`<div>${q.done?"✅":"⬜"} ${esc(q.text)} <span class="mute">(${q.n}/${q.target})</span></div>`).join("")||"<p class='note'>None generated yet today.</p>"}</div>`;
  renderBank(); renderDad();
  $("p-data").innerHTML=`<div class="card"><h2>Export</h2><div class="row"><button class="pri" onclick="dl()">⬇ Download full JSON</button><button onclick="dlcsv()">⬇ Download answers CSV</button></div><p class="note">The JSON is built to hand to Claude: "Here's Seb's Arena record — what should we work on this week?"</p></div>
    <div class="card"><h2>Last 60 answers</h2><table><tr><th>When</th><th>World</th><th>Question</th><th>Put</th><th>Answer</th><th>Result</th><th>Secs</th></tr>${log.slice(-60).reverse().map(e=>`<tr><td class="mute">${fmt(e.at)}</td><td>${WE[e.w]}${e.boss?" 🥊":""}${e.cb?" 🔁":""}${e.hint?" 💡":""}</td><td>${esc(e.q)}</td><td>${esc(e.given)}</td><td>${esc(e.ans)}</td><td>${e.ok===2?'<span class="good">first try</span>':e.ok===1?'<span class="warnc">second go</span>':'<span class="badc">shown</span>'}</td><td>${e.secs}</td></tr>`).join("")}</table></div>`;
}
function renderBank(){
  const xp=REC?REC.xp:0; const avail=bankMinutes();
  $("p-bank").innerHTML=`<div class="card"><h2>iPad time bank</h2>
    <div class="grid"><div class="stat"><b>${xp}</b><small>XP earned in total</small></div><div class="stat"><b>${PAR.redeemedXP||0}</b><small>XP already cashed out</small></div><div class="stat"><b class="good">${avail} min</b><small>available now</small></div></div>
    <h3>Rate</h3><div class="row"><input type="number" id="rate" value="${PAR.rate}" min="1" style="width:100px"> XP per minute of iPad time <button onclick="saveRate()">Save rate</button></div>
    <p class="note">A normal 20-minute session earns roughly 400–700 XP, so 50 XP/min gives him about 10 minutes of iPad time for 20 minutes of work. Raise the rate to make it stricter, lower it to be more generous. Changing the rate changes what's available immediately.</p>
    <h3>Cash out</h3><div class="row"><input type="number" id="cash" value="${Math.min(avail,30)}" min="0" max="${avail}" style="width:100px"> minutes <button class="pri" onclick="cashOut()">Cash out</button></div>
    <p class="note">Cashing out records the XP as spent. His XP, rank and badges never go down — only the bank does.</p>
    <h3>Ledger</h3>${(PAR.ledger||[]).length?`<table><tr><th>When</th><th>Minutes</th><th>XP</th></tr>${PAR.ledger.slice().reverse().map(l=>`<tr><td>${fmt(l.at)}</td><td>${l.min}</td><td>${l.xp}</td></tr>`).join("")}</table>`:`<p class="note">Nothing cashed out yet.</p>`}</div>`;
}
async function saveRate(){ PAR.rate=Math.max(1,parseInt($("rate").value)||50); if(await putParent()){ render(); $("status").textContent="Rate saved."; } }
async function cashOut(){ const m=Math.max(0,Math.min(bankMinutes(),parseInt($("cash").value)||0)); if(!m) return; const xp=m*PAR.rate; PAR.redeemedXP=(PAR.redeemedXP||0)+xp; PAR.ledger=(PAR.ledger||[]).concat([{at:new Date().toISOString(),min:m,xp}]); if(await putParent()){ render(); $("status").textContent=`Cashed out ${m} minutes.`; } }
function renderDad(){
  const f=PAR.focus; const ws=["mine","brick","astro","forza","words","atlas"]; let prog="";
  if(f&&f.setAt&&REC){ const sel=f.worlds&&f.worlds.length?f.worlds:ws; const n=(REC.log||[]).filter(e=>e.at>f.setAt&&sel.includes(e.w)).length; const done=REC.dadDone&&REC.dadDone[f.setAt]; prog=`<div class="card"><h2>Current challenge</h2><p><b>${esc(f.text)}</b></p><p>${sel.map(w=>WE[w]+" "+WN[w]).join(" · ")} · target ${f.target} questions · reward ${f.xp} XP · 1.5× XP while it runs</p><p>${done?'<span class="good">Completed ✓</span>':`${Math.min(n,f.target)} / ${f.target} so far`} · set ${fmt(f.setAt)}</p><button class="danger" onclick="clearDad()">Clear challenge</button></div>`; }
  $("p-dad").innerHTML=prog+`<div class="card"><h2>${f&&f.setAt?"Set a new challenge":"Set a challenge"}</h2><p class="note">This appears on his hub as "Dad's Challenge" with a gold border on the chosen worlds. Questions in those worlds earn 1.5× XP until the target is met, then he gets the reward and a badge. Use it to steer him at what you've seen in Needs work — e.g. "Brick Builder: 30 words this week".</p>
    <div class="row"><input id="dtext" placeholder="e.g. Crack the 7 and 8 times tables" style="flex:1;min-width:240px" value="${esc(f&&f.text||"")}"></div>
    <div style="margin:10px 0">${ws.map(w=>`<label class="ck"><input type="checkbox" class="dw" value="${w}" ${f&&f.worlds&&f.worlds.includes(w)?"checked":""}> ${WE[w]} ${WN[w]}</label>`).join("")}</div>
    <div class="row">Target <input type="number" id="dtarget" value="${f&&f.target||30}" min="5" style="width:90px"> questions · Reward <input type="number" id="dxp" value="${f&&f.xp||100}" min="10" style="width:90px"> XP <button class="pri" onclick="saveDad()">Start challenge</button></div></div>`;
}
async function saveDad(){ const text=$("dtext").value.trim(); if(!text) return alert("Give the challenge a name."); const worlds=[...document.querySelectorAll(".dw:checked")].map(c=>c.value); PAR.focus={text,worlds,target:Math.max(5,parseInt($("dtarget").value)||30),xp:Math.max(10,parseInt($("dxp").value)||100),setAt:new Date().toISOString()}; if(await putParent()){ render(); $("status").textContent="Challenge set — it shows on his hub next time it loads."; } }
async function clearDad(){ PAR.focus=null; if(await putParent()){ render(); } }
function copyOpenHints(){ const H=Object.values(REC.hinted||{}).filter(h=>!h.secure); const txt="Seb's Arena — questions he needed a clue on (not yet secure), "+new Date().toLocaleDateString("en-GB")+":\n"+H.map(h=>`- [${WN[h.w]}] ${h.q} → ${h.ans} (${h.k}; clue used ${h.n}×)`).join("\n"); navigator.clipboard.writeText(txt).then(()=>{ $("status").textContent="Copied "+H.length+" items."; }); }
function dl(){ const blob=new Blob([JSON.stringify({record:REC,parent:PAR,exportedAt:new Date().toISOString()},null,1)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="seb-arena-"+new Date().toISOString().slice(0,10)+".json"; a.click(); }
function dlcsv(){ const rows=[["at","world","topic","question","given","answer","result","secs","tier","boss","comeback","clue"]].concat((REC.log||[]).map(e=>[e.at,e.w,e.k,e.q,e.given,e.ans,e.ok,e.secs,e.tier,e.boss,e.cb,e.hint||0])); const csv=rows.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\n"); const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"})); a.download="seb-arena-answers.csv"; a.click(); }
loadAll();
</script>
